$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Health responds successfully', () => pm.response.to.have.status(200));
      pm.test('Response has success flag', () => pm.expect(pm.response.json().success).to.eql(true));
    language: text/javascript
order: 1000
