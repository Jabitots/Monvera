$kind: http-request
url: "{{baseUrl}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "customerId": "{{customerId}}",
      "orderItems": [{ "productId": "{{productId}}", "quantity": 1 }],
      "status": "not-a-status"
    }
scripts:
  - type: afterResponse
    code: pm.test('Invalid status returns 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 11000
